name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: sravan9661/roboshop-mongodb:4.0.0 
    container_name: mongodb 
    volumes:
    - mongodb:/data/db 
  catalogue:
    build: ./catalogue
    image: sravan9661/roboshop-catalogue:4.0.0
    container_name: catalogue
    environment:
      MONGO: "true" 
      MONGO_URL: "mongodb://mongodb:27017/catalogue"
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    image: sravan9661/roboshop-frontend:4.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - user
    - catalogue
    - payment
    - shipping
    - cart
  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis:/data
  user:
    build: ./user
    image: sravan9661/roboshop-user:4.0.0
    container_name: user
    environment:
      MONGO : "true" 
      MONGO_URL: "mongodb://mongodb:27017/user" 
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
      - mongodb
  cart:
    build: ./cart
    image: sravan9661/roboshop-cart:4.0.0
    container_name: cart
    environment:
      REDIS_HOST: redis 
      CATALOGUE_HOST: catalogue 
      CATALOGUE_PORT: 8080
    depends_on:
      - redis
      - catalogue
  mysql:
    build: ./mysql
    image: sravan9661/roboshop-mysql:4.0.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: RoboShop@1
    volumes:
      - mysql:/var/lib/mysql
  shipping:
    build: ./shipping
    image: sravan9661/roboshop-shipping:4.0.0
    container_name: shipping
    environment:
      - CART_ENDPOINT=cart:8080
      - DB_HOST=mysql
    depends_on:
      - mysql
      - cart

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=roboshop
      - RABBITMQ_DEFAULT_PASS=roboshop123 
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  
  payment:
    build: ./payment
    image: sravan9661/roboshop-payment:4.0.0
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080 
      USER_HOST: user 
      USER_PORT: 8080 
      AMQP_HOST: rabbitmq 
      AMQP_USER: roboshop 
      AMQP_PASS: roboshop123
    depends_on:
      - rabbitmq
      - user
      - cart
    
networks:
  default: 
    name: roboshop
    driver: bridge
    external: false 
volumes:
  mongodb: 
  redis:
  mysql:
  rabbitmq: