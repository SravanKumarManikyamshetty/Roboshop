name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: roboshop/mongodb # docker build -t joindevops/mongodb:4.0.0
    container_name: mongodb # docker run -d --network roboshop joindevops/mongodb:4.0.0
    volumes:
    - mongodb:/data/db # mongodb stores data in /data/db directory
  catalogue:
    build: ./catalogue
    image: roboshop/catalogue
    container_name: catalogue
    environment:
      - MONGO: "true" 
      - MONGO_URL: "mongodb://mongodb:27017/catalogue"
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    image: roboshop/frontend
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - user
    - catalogue
    - payment
    - shipping
    - cart
  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis:/data
  user:
    build: ./user
    image: roboshop/user
    container_name: user
    environment:
      - MONGO : "true" 
      - MONGO_URL: "mongodb://mongodb:27017/user" 
      - REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
      - mongodb
  cart:
    build: ./cart
    image: roboshop/cart
    container_name: cart
    depends_on:
      - redis
      - catalogue
  mysql:
    build: ./mysql
    image: roboshop/mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: RoboShop@1
    volumes:
      - mysql:/var/lib/mysql
  shipping:
    build: ./shipping
    image: roboshop/shipping
    container_name: shipping
    environment:
      - CART_ENDPOINT=cart:8080
      - DB_HOST=mysql
    depends_on:
      - mysql
      - cart

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=roboshop
      - RABBITMQ_DEFAULT_PASS=roboshop123 
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  
  payment:
    build: ./payment
    image: roboshop/payment
    container_name: payment
    depends_on:
      - rabbitmq
      - user
      - cart
    
networks:
  default: # this means all the services in this file use this network
    name: roboshop
    driver: bridge
    external: false # if true it should be created manually, if false docker creates this network

volumes:
  mongodb: # docker volume create mongodb
  redis:
  mysql:
  rabbitmq: